[package]
name = "delib"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Shared desktop integration primitives"
repository = "https://github.com/sammwyy/delib"
homepage = "https://github.com/sammwyy/delib"
readme = "README.md"
keywords = ["desktop", "xdg", "icons", "windows", "freedesktop"]
categories = ["os::linux-apis", "os::windows-apis", "filesystem"]

[lib]
path = "src/lib.rs"

[features]
default = ["xdg"]
xdg = []
windows = ["dep:windows"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
